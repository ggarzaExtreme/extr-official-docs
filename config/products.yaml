# Products: the explorer's Group By › Product. Every docs-site entry sits in one family of one kind
# (Hardware, Software or Solutions), which the docs site's own headings don't give. Kept by hand.
#
# A family lists regular expressions, each matched against the whole entry name, ignoring case. The
# first family that matches wins, in the order written here, so the "(Hardware)" twins come before the
# software families that take the plain names (the docs site lists "ERS 3600 Series" for the software
# and "ERS 3600 Series (Hardware)" for the switches).
#
# Each scan lists under To Check any docs-site entry no family matches. Main-site groups (policies,
# stencils) aren't products: the explorer shows them on their own.

Hardware:
  Universal Switches:
    - '(4120|4220|5120|5320|5420|5520|5720|7830|8520) Series'
